services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/media:/app/media
      - ./backend/outputs:/app/outputs
      - ./backend/logs:/app/logs
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
